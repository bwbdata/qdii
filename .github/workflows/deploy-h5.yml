name: 手动发布 H5

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qdii-h5-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 检查公开数据文件
        run: node -e "JSON.parse(require('node:fs').readFileSync('web/public/data/latest.json', 'utf8'))"
      - name: 发布到 Cloudflare Worker
        run: npx wrangler@4 deploy --assets web/public --name "$CF_WORKER_NAME" --compatibility-date 2026-08-06
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || secrets.CF_WORKER_NAME }}
