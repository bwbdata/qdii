name: 更新并发布 H5
on:
  workflow_dispatch:
  schedule:
    - cron: "10 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
permissions:
  contents: write

concurrency:
  group: qdii-h5-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=optional --ignore-scripts
      - name: 查询最新限额
        run: node scripts/query-purchase-limits.js --output-dir .qdii-purchase-limits
        continue-on-error: true
      - run: node scripts/build-web-data.js --input .qdii-purchase-limits/latest.json --output web/public/data/latest.json
      - name: 提交最新公开数据
        shell: bash
        run: |
          git add web/public/data/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update QDII purchase-limit data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - run: npx wrangler@4 deploy --assets web/public --name "$CF_WORKER_NAME" --compatibility-date 2026-08-06
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || secrets.CF_WORKER_NAME }}
