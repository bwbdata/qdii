name: 更新并发布 H5
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "10 1 * * *"
    - cron: "30 6 * * *"
    - cron: "30 12 * * *"
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --omit=optional --ignore-scripts
      - run: node scripts/query-purchase-limits.js --output-dir .qdii-purchase-limits
      - run: node scripts/build-web-data.js --input .qdii-purchase-limits/latest.json --output web/public/data/latest.json
      - run: npx wrangler@4 pages deploy web/public --project-name "$CF_PAGES_PROJECT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
