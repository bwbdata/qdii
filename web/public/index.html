<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2b3e">
    <title>QDII 申购限额</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="toolbar" aria-label="指数筛选和数据状态">
        <div class="tabs" role="tablist">
          <button class="tab active" data-index="nasdaq100" role="tab">纳斯达克100</button>
          <button class="tab" data-index="sp500" role="tab">标普500</button>
          <button class="tab" data-index="all" role="tab">全部</button>
        </div>
        <button id="export-current" class="export-button" type="button">导出图片</button>
      </section>

      <section id="fund-sections" class="fund-sections" aria-live="polite"></section>
      <footer>仅整理公开申购限制信息，不构成基金推荐或投资建议。</footer>
    </main>

    <template id="fund-section-template">
      <section class="fund-section">
        <div class="section-header"><h2></h2><button class="updated-at" type="button" aria-expanded="false"></button></div>
        <section class="data-status" hidden></section>
        <div class="channel">
          <div class="channel-heading"><h3>代销</h3><span class="count"></span></div>
          <div class="table-wrap sales-table"></div>
          <p class="empty sales-empty" hidden>暂无确认的限额申购记录。</p>
        </div>
        <div class="channel direct">
          <div class="channel-heading"><h3>直销</h3><span>以官方 APP 实际显示为准</span></div>
          <div class="table-wrap direct-table"></div>
          <p class="empty direct-empty" hidden>暂无可展示的直销公告限额。</p>
        </div>
      </section>
    </template>
    <script src="./app.js"></script>
  </body>
</html>
