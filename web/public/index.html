<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2b3e">
    <title>QDII 申购限额</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <h1>QDII 申购限额</h1>
        <p id="updated-at" class="updated-at"></p>
      </header>

      <section class="toolbar" aria-label="指数筛选和数据状态">
        <div class="tabs" role="tablist">
          <button class="tab active" data-index="nasdaq100" role="tab">纳斯达克100</button>
          <button class="tab" data-index="sp500" role="tab">标普500</button>
          <button class="tab" data-index="all" role="tab">全部</button>
        </div>
        <button id="export-current" class="export-button" type="button">导出图片</button>
      </section>

      <section id="data-status" class="data-status" hidden aria-live="polite"></section>

      <section class="table-card" aria-live="polite">
        <div class="table-head">
          <span class="col-fund">基金</span>
          <span class="col-code">代码</span>
          <span class="col-amount">代销</span>
          <span class="col-amount">直销</span>
        </div>
        <div id="fund-list" class="fund-list"></div>
        <p id="empty-hint" class="empty" hidden>当前筛选下暂无数据。</p>
      </section>

      <footer>仅整理公开申购限制信息，不构成基金推荐或投资建议。</footer>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
